<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob:; img-src 'self' data:;">
  <title>Claude语音助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="setup-overlay" id="setupOverlay" style="display:none">
    <div class="setup-card">
      <h2>首次启动设置</h2>
      <p class="setup-desc" id="setupDesc">正在下载 Whisper 引擎...</p>
      <div class="setup-progress-bar"><div class="setup-progress-fill" id="setupProgressFill"></div></div>
      <p class="setup-percent" id="setupPercent">0%</p>
    </div>
  </div>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Claude语音助手</h1>
      <button class="tts-toggle" id="ttsToggle" title="语音播报开关">🔊</button>
      <div class="status-row">
        <span class="model-label" id="modelLabel"></span>
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
    </div>

    <!-- Conversation (main area) -->
    <div class="conversation" id="conversation"></div>

    <!-- Log -->
    <div class="log-box" id="logBox" style="display:none">
      <p class="log-text" id="logText"></p>
    </div>

    <!-- Input area (mic + text + send) -->
    <div class="input-area">
      <div class="image-preview" id="imagePreview" style="display:none">
        <img id="previewImg" src="" alt="preview">
        <button class="remove-image" id="removeImageBtn">✕</button>
      </div>
      <div class="input-row">
        <div class="mic-wrapper">
          <div class="pulse-ring" id="pulseRing"></div>
          <button class="mic-button" id="micButton">
            <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="2" width="6" height="11" rx="3" ry="3"/>
              <path d="M5 10a7 7 0 0 0 14 0"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
              <line x1="8" y1="22" x2="16" y2="22"/>
            </svg>
          </button>
        </div>
        <button class="image-btn" id="imageBtn" title="发送图片">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>
        </button>
        <input type="file" id="fileInput" accept="image/*" style="display:none">
        <textarea class="text-input" id="textInput" placeholder="输入消息..." rows="1"></textarea>
        <button class="send-button" id="sendButton">发送</button>
      </div>
      <p class="hint" id="hintText">点击说话 / 空格键连续对话</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
