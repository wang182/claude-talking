<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob:;">
  <title>Claude桌面助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Claude桌面助手</h1>
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
    </div>

    <!-- Camera -->
    <div class="camera-section" id="cameraSection">
      <video id="cameraPreview" autoplay playsinline muted></video>
      <button class="camera-toggle" id="cameraToggle">📷</button>
      <canvas id="cameraCanvas" style="display:none"></canvas>
    </div>

    <!-- Main button -->
    <div class="button-section">
      <div class="pulse-ring" id="pulseRing"></div>
      <button class="mic-button" id="micButton" ontouchstart="">
        <span class="mic-icon">🎤</span>
      </button>
      <p class="hint" id="hintText">按住说话，松开发送</p>
    </div>

    <!-- Log -->
    <div class="log-box" id="logBox" style="display:none">
      <p class="log-text" id="logText"></p>
    </div>

    <!-- Conversation -->
    <div class="conversation" id="conversation"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
