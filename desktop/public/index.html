<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:; connect-src 'self' blob:;">
  <title>Claude桌面助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Claude桌面助手</h1>
      <div class="status-row">
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText">就绪</span>
      </div>
    </div>

    <!-- Conversation (main area) -->
    <div class="conversation" id="conversation"></div>

    <!-- Log -->
    <div class="log-box" id="logBox" style="display:none">
      <p class="log-text" id="logText"></p>
    </div>

    <!-- Mic button (bottom) -->
    <div class="button-section">
      <div class="pulse-ring" id="pulseRing"></div>
      <button class="mic-button" id="micButton">
        <span class="mic-icon">🎤</span>
      </button>
      <p class="hint" id="hintText">点击说话 / 空格键连续对话</p>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
